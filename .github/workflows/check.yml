name: Offline PowerShell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem skills,tests,tools -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' }) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "Syntax errors in $($file.Name)" }
          }
      - name: Run standalone offline mocks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Production scripts intentionally restrict output to D:\Codex.
          # Stage the tests there; never invoke a real deployment command.
          $stage = Join-Path 'D:\Codex' "ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $stage) { throw 'Test staging directory already exists' }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'tests','skills','tools' -Destination $stage -Recurse
          foreach ($name in 'Test-ScriptBehavior.ps1','Test-GuestNetworkBehavior.ps1','Test-HostPathBehavior.ps1') {
            $output = & pwsh -NoProfile -NonInteractive -File (Join-Path $stage "tests/$name") 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $output
            if ($code -ne 0) { throw "Offline test process failed: $name" }
            $offset = $output.IndexOf('{')
            if ($offset -lt 0) { throw "Missing JSON report: $name" }
            $report = $output.Substring($offset) | ConvertFrom-Json
            if ($null -eq $report.failed -or $report.failed -ne 0) { throw "Offline test cases failed: $name" }
          }
          & pwsh -NoProfile -NonInteractive -File (Join-Path $stage 'tests/Test-V11Session.ps1') -OutputRoot $stage
          if ($LASTEXITCODE -ne 0) { throw 'V11 session tests failed' }
          $v11 = Get-Content -LiteralPath (Join-Path $stage 'V11-session-test-results.json') -Raw | ConvertFrom-Json
          if ($null -eq $v11.failed -or $v11.failed -ne 0) { throw 'V11 session test cases failed' }

  macos-preview:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.0'
      - name: Build darwin Go gateways and verify Claudome.Mac contracts
        run: |
          set -euo pipefail
          mkdir -p installer/artifacts
          (cd installer/network-gateway && GOOS=darwin GOARCH=arm64 go build -o ../artifacts/ClaudeNetworkGateway-darwin-arm64 .)
          (cd installer/network-gateway && GOOS=darwin GOARCH=amd64 go build -o ../artifacts/ClaudeNetworkGateway-darwin-amd64 .)
          dotnet build installer/Claudome.Mac/Claudome.Mac.csproj -c Release
          dotnet exec installer/Claudome.Mac/bin/Release/net10.0/Claudome.Mac.dll --self-test installer/artifacts/mac-tests
      - name: Try Avalonia --preview screenshot (when GUI session is attached)
        continue-on-error: true
        run: |
          mkdir -p installer/artifacts/mac-ui-preview
          dotnet exec installer/Claudome.Mac/bin/Release/net10.0/Claudome.Mac.dll --preview installer/artifacts/mac-ui-preview
      - name: Package macOS .app preview bundles (arm64 & x64)
        run: |
          set -euo pipefail
          chmod +x installer/scripts/package_mac.sh
          bash installer/scripts/package_mac.sh 0.4.9 "arm64 x64"
      - name: Upload macOS preview bundles and test reports
        uses: actions/upload-artifact@v4
        with:
          name: claudome-macos-preview
          path: |
            installer/artifacts/mac-release/*.zip
            installer/artifacts/mac-release/SHA256SUMS-mac.txt
            installer/artifacts/mac-tests/mac-tests.json
            installer/artifacts/mac-ui-preview/*
          retention-days: 14
